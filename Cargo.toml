[package]
name = "microtypo-zed"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Alexey Simonenko <alexey@simonenko.dev>"]
description = "Zed extension that runs the MicroTypo language server"
repository = "https://github.com/meritt/microtypo-zed"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
exclude = ["lsp"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
sha2 = { version = "=0.11.1", default-features = false }
zed_extension_api = "=0.7.0"
